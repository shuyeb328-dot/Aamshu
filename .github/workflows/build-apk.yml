name: Aamshu Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find Aamshu ZIP
        id: findzip
        shell: bash
        run: |
          ZIP="./aamshu-github-ready-aamshu-v4.6-fixed-v2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Required Aamshu ZIP not found: $ZIP"
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using: $ZIP"

      - name: Extract Aamshu source
        shell: bash
        run: |
          rm -rf aamshu-source
          mkdir aamshu-source
          unzip -q "${{ steps.findzip.outputs.zip }}" -d aamshu-source

      - name: Locate mobile project
        id: mobile
        shell: bash
        run: |
          APP_CONFIG="$(find aamshu-source -type f -name 'app.config.js' | head -n 1)"
          if [ -z "$APP_CONFIG" ]; then
            echo "Aamshu mobile app.config.js was not found."
            exit 1
          fi

          MOBILE_DIR="$(dirname "$APP_CONFIG")"
          echo "mobile_dir=$MOBILE_DIR" >> "$GITHUB_OUTPUT"
          echo "Mobile project: $MOBILE_DIR"

      - name: Install mobile dependencies
        working-directory: ${{ steps.mobile.outputs.mobile_dir }}
        run: |
          npm install
          npx expo install --fix

      - name: Generate Android project
        working-directory: ${{ steps.mobile.outputs.mobile_dir }}
        run: CI=1 npx expo prebuild --platform android

      - name: Enable AndroidX and Jetifier
        working-directory: ${{ steps.mobile.outputs.mobile_dir }}/android
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
      - name: Pin Gradle 8.8
        working-directory: ${{ steps.mobile.outputs.mobile_dir }}/android
        run: |
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.8-all.zip#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        working-directory: ${{ steps.mobile.outputs.mobile_dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
